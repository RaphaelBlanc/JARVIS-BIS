services:
  - type: web
    name: assistant-gateway
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HOME_SERVER_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: GATEWAY_PUBLIC_URL
        sync: false
      - key: DESKTOP_RATE_LIMIT_PER_MINUTE
        sync: false
      - key: TRUST_PROXY_HEADERS
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: MAX_RESPONSE_LENGTH
        sync: false
      - key: ALLOW_ALL_USERS
        sync: false
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: TELEGRAM_ALLOWED_USER_IDS
        sync: false
      - key: DISCORD_ALLOWED_USER_IDS
        sync: false
